[project]
name = "truck-weather-routing-backend"
version = "0.1.0"
description = "Weather-aware truck routing API (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "django-cors-headers>=4.7",
    "httpx>=0.28",
    "shapely>=2.1",
    "pyproj>=3.7",
    "timezonefinder>=6.5",
    "numpy>=2.2",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "django-stubs>=5.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["core"]

[tool.vercel]
entrypoint = "config.wsgi:application"
